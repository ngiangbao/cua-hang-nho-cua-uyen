# Build bản desktop (Windows, macOS, Linux) bằng Electron và bản Android (TWA).
# Gắn tag dạng v1.0.0 rồi push để tự đăng file lên trang Releases; chạy tay (workflow_dispatch) chỉ để build thử.
name: Build ứng dụng

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lấy số phiên bản từ tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm install --no-audit --no-fund
      - name: Đóng gói
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Chạy thử bản Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          SMOKE_TEST=1 timeout 90 xvfb-run -a npx electron . --no-sandbox | tee smoke.log
          grep -q "SMOKE_OK Cửa hàng nhỏ của Uyên" smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  android:
    name: Android (TWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Giải mã khóa ký
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Build APK
        working-directory: twa
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export APP_VERSION="${GITHUB_REF_NAME#v}"; fi
          gradle assembleRelease --no-daemon
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk "../out/CuaHangNhoCuaUyen-${APP_VERSION:-dev}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Đăng lên Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Cửa hàng nhỏ của Uyên ${{ github.ref_name }}
          files: files/*
          body: |
            **Tải về**
            - Windows: file `.exe` (bản cài đặt) hoặc `win-portable.exe` (chạy không cần cài)
            - macOS: file `.dmg` (`arm64` cho máy chip Apple M, `x64` cho máy chip Intel)
            - Linux: file `.AppImage` (chạy trực tiếp) hoặc `.deb` (Ubuntu, Debian)
            - Android: file `.apk`

            Hướng dẫn cài đặt: xem phần “Tải bản cài đặt” trong README.
