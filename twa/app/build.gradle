// Ứng dụng Android dạng Trusted Web Activity: mở bản web của game toàn màn hình, xoay ngang
plugins {
    id "com.android.application"
}

def appVersionName = System.getenv("APP_VERSION") ?: "1.0.0"
def appVersionCode = (System.getenv("APP_VERSION_CODE") ?: "1") as Integer

android {
    namespace "io.github.ngiangbao.cuahangnhocuauyen"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.ngiangbao.cuahangnhocuauyen"
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            // Khóa ký lấy từ GitHub Secrets khi build trên CI
            storeFile file(System.getenv("ANDROID_KEYSTORE") ?: "release.p12")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias "uyen"
            keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            storeType "pkcs12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
